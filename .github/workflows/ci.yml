name: CI

on:
  push:
    branches: [main, testnet]
  pull_request:
    branches: [main, testnet]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm pkg-config libssl-dev libudev-dev protobuf-compiler

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - run: cargo clippy --workspace --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm pkg-config libssl-dev libudev-dev protobuf-compiler

      # RUSTSEC-2026-0258 is fixed in h2 0.4.16. The advisory exception in
      # deny.toml exists for the unpatched 0.3 line only; this keeps the 0.4
      # line honest regardless of which scanners are enabled.
      - name: Assert patched h2 0.4 line in lockfile
        run: |
          python3 - <<'PY'
          import re, sys
          lock = open("Cargo.lock").read()
          bad = [v for v in re.findall(r'name = "h2"\nversion = "(0\.4\.\d+)"', lock)
                 if int(v.split(".")[2]) < 16]
          if bad:
              sys.exit(f"h2 {bad} is below 0.4.16 (RUSTSEC-2026-0258)")
          print("h2 0.4 line is patched")
          PY

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - run: cargo test --workspace --locked

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
